name: "Test coverage"
on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: "Repo to run the tests on"
        required: true
        default: "microsoft/fluentui"
      branch:
        description: "Branch to run the tests on"
        required: true
        default: "master"
      include-legacy-tests:
        description: "Run legacy private-method tests for diagnostics without publishing"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run_tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      # Configure Git before checkout materializes the long snapshot paths on Windows.
      - name: Enable Git long paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Checkout [master]
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Checkout [react-charting]
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.event.inputs.repo || 'microsoft/fluentui' }}
          ref: ${{ github.event.inputs.branch || 'master' }}
          path: repo1
          persist-credentials: false

      - name: Show current directory
        run: echo "$PWD" && ls

      - name: Show repo1 directory
        run: ls ./repo1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.x'

      - name: Install coverage helper dependencies
        if: inputs.include-legacy-tests
        working-directory: tools/UnitTestApp
        run: yarn install --frozen-lockfile

      - name: Enable the Fluent UI package manager
        working-directory: repo1
        run: corepack enable

      - name: Install Fluent UI workspace dependencies
        working-directory: repo1
        run: yarn install --immutable

      - name: Build
        working-directory: repo1
        run: yarn nx run react-charting:build

      - name: Change function visibility from private to public
        if: inputs.include-legacy-tests
        uses: ./tools/UnitTestApp/ChangeFunctionVisibility
        with:
          osType: ${{ matrix.os }}

      # Scheduled coverage uses the unmodified upstream Jest configuration and default test mode.
      - name: Enable legacy charting unit tests
        if: inputs.include-legacy-tests
        working-directory: repo1/packages/charts/react-charting
        shell: bash
        run: |
          node -e "const fs = require('node:fs'); const file = 'config/tests.js'; const config = fs.readFileSync(file, 'utf8'); if (!config.includes(\"'PROD'\")) throw new Error('Expected PROD charting test mode'); fs.writeFileSync(file, config.replace(\"'PROD'\", \"'TEST'\"));"

      # The upstream just-scripts test task does not forward coverage directory or reporter options.
      - name: Run charting tests with coverage
        id: charting_coverage
        working-directory: repo1/packages/charts/react-charting
        shell: bash
        timeout-minutes: 12
        env:
          TZ: UTC
        run: |
          yarn run -T jest --ci --coverage --coverageDirectory "coverage/${{ matrix.os }}" \
            --coverageReporters=html --coverageReporters=text --reporters=default \
            --json --outputFile=charting-test-results.json | tee coverageReport.txt
          test -s "coverage/${{ matrix.os }}/index.html"
          grep -q '^All files[[:space:]]*|' coverageReport.txt

      - name: Run VerticalBarChart tests with coverage on Windows
        if: runner.os == 'Windows'
        id: vertical_bar_coverage
        working-directory: repo1/packages/charts/react-charting
        shell: bash
        timeout-minutes: 5
        env:
          TZ: UTC
        run: |
          yarn run -T jest --ci ./src/components/VerticalBarChart --coverage \
            --coverageDirectory "coverage/${{ matrix.os }}_VerticalBarChart" --coverageReporters=html \
            --reporters=default --json --outputFile=vertical-bar-test-results.json
          test -s "coverage/${{ matrix.os }}_VerticalBarChart/index.html"

      - name: Save coverage diagnostics on failure
        if: ${{ !cancelled() && (steps.charting_coverage.outcome == 'failure' || steps.vertical_bar_coverage.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-diagnostics-${{ matrix.os }}
          path: |
            repo1/packages/charts/react-charting/coverageReport.txt
            repo1/packages/charts/react-charting/*-test-results.json
            repo1/packages/charts/react-charting/coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate coverage file name
        shell: bash
        run: |
          echo "COVERAGE_FILENAME=test_coverage_${{ matrix.os }}_$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_ENV
      - name: Save coverage folder
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{matrix.os}}
          path: ./repo1/packages/charts/react-charting/coverage/${{matrix.os}}
          if-no-files-found: error

      - name: Save coverage file
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{env.COVERAGE_FILENAME}}_report
          path: ./repo1/packages/charts/react-charting/coverageReport.txt
          if-no-files-found: error

      - name: Save coverage folder for a single test
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage_VBC
          path: ./repo1/packages/charts/react-charting/coverage/${{matrix.os}}_VerticalBarChart
          if-no-files-found: error
  push_artifacts_to_repo:
    needs: run_tests
    runs-on: "ubuntu-latest"
    permissions:
      contents: write

    steps:
      - name: Download all artifacts to publish together
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: "ubuntu-latest"
          path: "./coverage/ubuntu-latest"

      - name: Download all artifacts to publish together
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: "macos-latest"
          path: "./coverage/macos-latest"

      - name: Download all artifacts to publish together
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: "windows-latest"
          path: "./coverage/windows-latest"

      - name: Download all artifacts to publish together
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: "coverage_VBC"
          path: "./coverage/coverage_VBC"

      - name: Download all artifacts to publish together
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: test_coverage_*
          path: "./coverage/coverageFiles"

      - name: Generate html to show the latest coverages for all os types
        run: |
          cd ./coverage
          echo "<!DOCTYPE html><html><head><title>Contributor Readiness</title></head><body><h1>View contributor guides and full test coverage reports</h1><ul><li><a href="https://uifabric.visualstudio.com/iss/_wiki/wikis/iss.wiki/280/Charting-Concepts">Contributor guides</a></li><li><a href="./windows-latest/index.html">Coverage for Windows</a></li><li><a href="./ubuntu-latest/index.html">Coverage for Ubuntu</a></li><li><a href="./macos-latest/index.html">Coverage for MacOS</a></li><li><a href="./coverage_VBC/index.html">Coverage for Vertical bar chart - Windows</a></li></ul></body></html>" >> index.html
        shell: bash

      - name: Generate coverage JSON summaries
        working-directory: coverage
        shell: bash
        run: |
          for os in ubuntu macos windows; do
            reports=(coverageFiles/test_coverage_"$os"-*_report/coverageReport.txt)
            test "${#reports[@]}" = 1 && test -s "${reports[0]}" || exit 1
            percentage=$(awk -F'|' '/^All files[[:space:]]*\|/ { gsub(/[[:space:]]/, "", $2); print $2; exit }' "${reports[0]}")
            if [[ ! "$percentage" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
              echo "Missing statement coverage percentage for $os" >&2
              exit 1
            fi
            jq -n --arg percentage "$percentage" '{statementCoverage: $percentage}' > "${os}Coverage.json"
          done
          cp ubuntuCoverage.json testCoverage.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: "./coverage"

      - name: Checkout publication repository
        if: github.ref == 'refs/heads/main' && !inputs.include-legacy-tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: repo

      - name: Publish coverage reports to the artifact branch
        if: github.ref == 'refs/heads/main' && !inputs.include-legacy-tests
        working-directory: repo
        shell: bash
        run: |
          branch=test-coverage-artifacts
          existing=$(git ls-remote --heads origin "refs/heads/$branch")
          if [[ -n "$existing" ]]; then
            git fetch --depth=1 origin "refs/heads/$branch"
            git switch --detach FETCH_HEAD
          else
            git switch --orphan "$branch"
          fi

          rm -rf ubuntu-latest macos-latest windows-latest coverage_VBC coverageFiles
          cp -R ../coverage/. .
          git add -A -- ubuntu-latest macos-latest windows-latest coverage_VBC coverageFiles \
            index.html ubuntuCoverage.json macosCoverage.json windowsCoverage.json testCoverage.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Update charting test coverage reports'
            git push origin "HEAD:refs/heads/$branch"
          fi

